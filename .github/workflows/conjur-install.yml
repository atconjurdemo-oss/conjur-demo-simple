# conjur-install.yml — Install Conjur OSS on GKE (manual trigger).
# Run once on a fresh cluster before conjur-seed.yml.

name: Conjur Installation

on:
  workflow_dispatch:
    inputs:
      skip_install:
        description: "Skip install, only re-run account init"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

env:
  CONJUR_ACCOUNT: ${{ vars.CONJUR_ACCOUNT || 'myConjurAccount' }}

jobs:
  install:
    name: Install Conjur OSS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Install NGINX Ingress
        if: inputs.skip_install == 'false'
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx --force-update
          NGINX_READY=$(kubectl -n ingress-nginx get deploy ingress-nginx-controller \
            -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
          if helm -n ingress-nginx status ingress-nginx &>/dev/null && [ "${NGINX_READY:-0}" -ge 1 ]; then
            echo "NGINX already running — skipping."
          else
            helm -n ingress-nginx uninstall ingress-nginx 2>/dev/null || true
            kubectl delete namespace ingress-nginx --ignore-not-found
            kubectl wait --for=delete namespace/ingress-nginx --timeout=120s 2>/dev/null || true
            kubectl delete clusterrole ingress-nginx ingress-nginx-admission --ignore-not-found
            kubectl delete clusterrolebinding ingress-nginx ingress-nginx-admission --ignore-not-found
            kubectl delete ingressclass nginx --ignore-not-found
            kubectl delete validatingwebhookconfiguration ingress-nginx-admission --ignore-not-found
            helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
              --namespace ingress-nginx --create-namespace \
              --set controller.service.type=LoadBalancer \
              --wait --timeout 3m
          fi

      - name: Install Conjur OSS
        if: inputs.skip_install == 'false'
        run: |
          helm repo add cyberark https://cyberark.github.io/helm-charts --force-update
          kubectl create namespace conjur --dry-run=client -o yaml | kubectl apply -f -
          DATA_KEY="$(openssl rand -base64 32)"
          kubectl -n conjur create secret generic conjur-data-key \
            --from-literal=key="${DATA_KEY}" --dry-run=client -o yaml | kubectl apply -f -
          cat > /tmp/conjur-values.yaml <<EOF
          account:
            name: "${CONJUR_ACCOUNT}"
          authenticators: "authn,authn-jwt/k8s-cluster"
          ssl:
            hostname: "conjur-oss.conjur.svc.cluster.local"
          service:
            type: ClusterIP
          dataKey: "$(echo "${DATA_KEY}" | tr -d '\n')"
          EOF
          helm upgrade --install conjur-oss cyberark/conjur-oss \
            --namespace conjur --values /tmp/conjur-values.yaml --wait --timeout 5m
          ENCODED="$(echo -n 'authn,authn-jwt/k8s-cluster' | base64 | tr -d '\n')"
          kubectl -n conjur patch secret conjur-oss-conjur-authenticators \
            -p "{\"data\":{\"key\":\"${ENCODED}\"}}"
          kubectl -n conjur rollout restart deployment/conjur-oss
          kubectl -n conjur rollout status deployment/conjur-oss --timeout=3m

      - name: Initialize Conjur account
        if: inputs.skip_install == 'false'
        run: |
          POD="$(kubectl -n conjur get pod -l app=conjur-oss \
            -o jsonpath='{.items[0].metadata.name}')"
          ADMIN_KEY="$(kubectl -n conjur exec "${POD}" -c conjur-oss -- \
            conjurctl role retrieve-key "${CONJUR_ACCOUNT}:user:admin" \
            2>/dev/null | tr -d '[:space:]' || echo '')"
          if [ -z "${ADMIN_KEY}" ]; then
            kubectl -n conjur exec "${POD}" -c conjur-oss -- \
              conjurctl account create "${CONJUR_ACCOUNT}"
            ADMIN_KEY="$(kubectl -n conjur exec "${POD}" -c conjur-oss -- \
              conjurctl role retrieve-key "${CONJUR_ACCOUNT}:user:admin" | tr -d '[:space:]')"
          fi
          [ "${#ADMIN_KEY}" -gt 10 ] || { echo "ERROR: could not get admin key"; exit 1; }
          kubectl -n conjur delete secret conjur-admin-api-key --ignore-not-found
          kubectl -n conjur create secret generic conjur-admin-api-key \
            --from-literal=key="${ADMIN_KEY}"
          echo "Admin key stored (${#ADMIN_KEY} chars)."

      - name: Store TLS cert for sidecar
        run: |
          kubectl create namespace securetask --dry-run=client -o yaml | kubectl apply -f -
          POD="$(kubectl -n conjur get pod -l app=conjur-oss \
            -o jsonpath='{.items[0].metadata.name}')"
          CERT="$(kubectl -n conjur exec "${POD}" -c conjur-oss-nginx -- \
            cat /opt/conjur/etc/ssl/cert/tls.crt 2>/dev/null || echo '')"
          if [ -n "${CERT}" ]; then
            kubectl -n securetask delete secret conjur-ssl-cert --ignore-not-found
            kubectl -n securetask create secret generic conjur-ssl-cert \
              --from-literal=certificate="${CERT}"
            echo "conjur-ssl-cert stored."
          fi

      - name: Summary
        run: |
          echo "## Conjur Installation Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Account: ${CONJUR_ACCOUNT}" >> $GITHUB_STEP_SUMMARY
          echo "- Next: Run **Conjur Seed** workflow" >> $GITHUB_STEP_SUMMARY
