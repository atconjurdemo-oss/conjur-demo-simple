# build.yml — Build and push Docker images to GHCR.
# Triggered manually or on push to main.
# Images are then deployed using scripts/04-deploy-app.sh and 06-deploy-conjur-ui.sh
# by setting REGISTRY=ghcr.io/<owner> instead of Artifact Registry.

name: Build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "conjur-ui/**"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-webapp:
    name: Build Incident Tracker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push webapp
        uses: docker/build-push-action@v5
        with:
          context: app
          push: true
          tags: |
            ${{ env.REGISTRY }}/webapp:latest
            ${{ env.REGISTRY }}/webapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-conjur-ui:
    name: Build Conjur UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push conjur-ui
        uses: docker/build-push-action@v5
        with:
          context: conjur-ui
          push: true
          tags: |
            ${{ env.REGISTRY }}/conjur-ui:latest
            ${{ env.REGISTRY }}/conjur-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
