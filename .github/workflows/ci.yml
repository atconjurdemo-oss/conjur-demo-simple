# ci.yml --- Runs on every push and pull request.
# Checks: lint, SAST, OCV (dependency scan), Docker build, manifest validation.

name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  WEBAPP_IMAGE:    ghcr.io/${{ github.repository_owner }}/conjur-demo-simple-webapp
  CONJURUI_IMAGE:  ghcr.io/${{ github.repository_owner }}/conjur-demo-simple-conjur-ui

jobs:
  # ------ Lint ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app/ conjur-ui/

  # ------ SAST ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bandit --- Python security scan
        run: |
          pip install bandit[sarif]
          bandit -r app/ conjur-ui/ -f sarif -o bandit.sarif \
            --severity-level medium || true
      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit
        continue-on-error: true
      - name: Semgrep --- OWASP rules
        run: |
          pip install semgrep
          semgrep --config "p/python" --config "p/owasp-top-ten" \
            app/ conjur-ui/ --error || true
        continue-on-error: true

  # ------ OCV ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
  ocv:
    name: OCV (pip-audit + Trivy filesystem)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit --- webapp
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt || true
      - name: pip-audit --- conjur-ui
        run: pip-audit -r conjur-ui/requirements.txt || true
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type:      fs
          scan-ref:       .
          format:         sarif
          output:         trivy-fs.sarif
          severity:       HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
        continue-on-error: true

  # ------ Docker build (smoke test) ---------------------------------------------------------------------------------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, sast, ocv]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build webapp (no push)
        uses: docker/build-push-action@v5
        with:
          context: app
          push: false
          tags: ${{ env.WEBAPP_IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build conjur-ui (no push)
        uses: docker/build-push-action@v5
        with:
          context: conjur-ui
          push: false
          tags: ${{ env.CONJURUI_IMAGE }}:ci
          cache-from: type=gha

  # ------ Manifest validation ---------------------------------------------------------------------------------------------------------------------------------------------------------------
  validate-manifests:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin
      - name: Validate
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -ignore-filename-pattern '.*helm-values\.yaml' \
            k8s/**/*.yaml k8s/*.yaml
