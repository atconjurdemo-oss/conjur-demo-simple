{% extends "base.html" %}
{% block title %}Login — Conjur UI{% endblock %}
{% block content %}

<div style="max-width:420px; margin:4rem auto;">
  <div style="text-align:center; margin-bottom:2rem;">
    <div style="font-size:2.5rem; font-weight:800; color:var(--accent);">Conjur</div>
    <div style="color:var(--muted); font-size:.875rem; margin-top:.25rem;">
      OSS UI — {{ account }}
    </div>
    <div style="font-size:.75rem; color:var(--muted); margin-top:.4rem;">
      {{ conjur_url }}
    </div>
  </div>

  <div class="card">
    <div class="card-title">Sign in</div>
    <form method="post">
      <div class="form-row">
        <label>Username</label>
        <input type="text" name="username" value="admin" required autofocus/>
      </div>
      <div class="form-row">
        <label>API Key</label>
        <input type="password" name="api_key" required
               placeholder="Paste your Conjur API key"/>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">
        Sign in
      </button>
    </form>
  </div>

  <p style="font-size:.75rem; color:var(--muted); text-align:center; margin-top:1rem;">
    Use the API key printed by <code>conjurctl account create</code>
  </p>
</div>
{% endblock %}
