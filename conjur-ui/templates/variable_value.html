{% extends "base.html" %}
{% block title %}Variable Value — Conjur UI{% endblock %}
{% block content %}

<div class="page-title">Variable: <code>{{ var_id }}</code></div>

<div class="card" style="max-width:600px;">
  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% else %}
    <div class="card-title">Value</div>
    <pre>{{ value }}</pre>
    <p style="color:var(--muted); font-size:.75rem; margin-top:.75rem;">
      This value was fetched directly from Conjur. Do not share it.
    </p>
  {% endif %}
  <div style="margin-top:1rem;">
    <a href="{{ url_for('variables') }}" class="btn btn-outline btn-sm">
      ← Back to Variables
    </a>
  </div>
</div>

{% endblock %}
