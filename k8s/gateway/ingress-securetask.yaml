---
# App traffic — strips /app prefix before forwarding to webapp
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: securetask
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /app(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: webapp
                port:
                  number: 80

---
# Static traffic — no rewrite; nginx inside the presentation pod handles paths
# / → landing page, /presentation → slide deck
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-static
  namespace: securetask
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /presentation
            pathType: Prefix
            backend:
              service:
                name: presentation
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: presentation
                port:
                  number: 80
