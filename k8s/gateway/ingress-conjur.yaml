---
# Conjur UI — serves at /ui
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ui
  namespace: conjur
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-set-headers: "conjur/conjur-ui-headers"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /ui(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: conjur-ui
                port:
                  number: 80

---
# Custom headers forwarded to conjur-ui pod.
# proxy-set-headers is the snippet-free way to inject headers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: conjur-ui-headers
  namespace: conjur
data:
  X-Forwarded-Prefix: "/ui"
