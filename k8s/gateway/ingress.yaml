---
# Gateway Ingress — all services under one external IP.
#
# Routes:
#   /app          → webapp (Incident Tracker)       [securetask ns]
#   /ui           → conjur-ui (Admin Dashboard)      [conjur ns]
#   /presentation → presentation (static slides)     [securetask ns]
#   /monitoring   → grafana (metrics dashboard)      [monitoring ns]
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: securetask
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /app(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: webapp
                port:
                  number: 80

          - path: /presentation(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: presentation
                port:
                  number: 80

---
# Separate Ingress for conjur-ui (in conjur namespace)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ui
  namespace: conjur
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /ui(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: conjur-ui
                port:
                  number: 80

---
# Separate Ingress for Grafana (in monitoring namespace)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-monitoring
  namespace: monitoring
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-redirect-from: "http://localhost/"
    nginx.ingress.kubernetes.io/proxy-redirect-to: "/monitoring/"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /monitoring(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
