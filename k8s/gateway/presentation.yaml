---
# Serves the presentation HTML as a static site via nginx.
# The HTML is stored in a ConfigMap and mounted into the container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presentation
  namespace: securetask
  labels:
    app: presentation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: presentation
  template:
    metadata:
      labels:
        app: presentation
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: presentation-html
        - name: nginx-conf
          configMap:
            name: presentation-nginx-conf
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: presentation
  namespace: securetask
spec:
  selector:
    app: presentation
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP

---
# nginx config — listen on 8080 (non-root)
apiVersion: v1
kind: ConfigMap
metadata:
  name: presentation-nginx-conf
  namespace: securetask
data:
  default.conf: |
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
