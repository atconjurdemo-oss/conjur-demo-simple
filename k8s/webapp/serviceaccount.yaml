---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webapp
  namespace: securetask
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: conjur-secrets-provider
  namespace: securetask
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: conjur-secrets-provider
  namespace: securetask
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: conjur-secrets-provider
subjects:
  - kind: ServiceAccount
    name: webapp
    namespace: securetask

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: conjur-tokenreview
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: conjur-tokenreview-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: conjur-tokenreview
subjects:
  - kind: ServiceAccount
    name: conjur-authenticator
    namespace: conjur
