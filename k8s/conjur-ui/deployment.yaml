---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conjur-ui
  namespace: conjur
  labels:
    app: conjur-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conjur-ui
  template:
    metadata:
      labels:
        app: conjur-ui
    spec:
      serviceAccountName: conjur-ui
      automountServiceAccountToken: true
      containers:
        - name: conjur-ui
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: conjur-ui-config
            - secretRef:
                name: conjur-ui-secret
          readinessProbe:
            httpGet:
              path: /ui/healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /ui/healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: conjur-ui
  namespace: conjur
spec:
  selector:
    app: conjur-ui
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
