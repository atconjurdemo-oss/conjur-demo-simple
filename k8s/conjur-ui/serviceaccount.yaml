---
# ServiceAccount for the Conjur UI pod.
# Mapped to host/myapp/conjur-ui in Conjur policy for JWT authentication.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: conjur-ui
  namespace: conjur
automountServiceAccountToken: true

---
# Allow conjur-ui pod to read Conjur pod logs via the Kubernetes API.
# Used by the Audit Log page to stream security events from conjur-oss.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: conjur-ui-logs
  namespace: conjur
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: conjur-ui-logs
  namespace: conjur
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: conjur-ui-logs
subjects:
  - kind: ServiceAccount
    name: conjur-ui
    namespace: conjur
